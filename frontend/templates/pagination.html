<nav class="pagination">
  {% if page > 1 %}
    <a href="?{{ param }}={{ page - 1 }}" role="button">Previous</a>
  {% endif %}

  <span>
    Page {{ page }}
    <small style="opacity:0.6; margin-left:0.25rem;">
      (showing {{ (page-1)*per_page + 1 }}–{{ [page*per_page, total]|min }} of {{ total }})
    </small>
  </span>

  {% if page * per_page < total %}
    <a href="?{{ param }}={{ page + 1 }}" role="button">Next</a>
  {% endif %}
</nav>
